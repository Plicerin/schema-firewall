<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1360 860" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram showing how SchemaFirewall sits between an application and an LLM provider, validating JSON responses against registered schemas, coercing safe mismatches, retrying invalid responses, and writing audit logs.">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8699" />
          </marker>
          <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#315efb" />
          </marker>
          <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f8f4e" />
          </marker>
          <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#b26a00" />
          </marker>
          <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#bf3b2f" />
          </marker>
        </defs>

        <!-- connectors behind nodes -->
        <path d="M 250 250 C 320 250, 340 250, 400 250" stroke="#7a8699" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
        <path d="M 930 250 C 1000 250, 1025 250, 1090 250" stroke="#7a8699" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
        <path d="M 1090 305 C 1008 305, 1005 370, 930 370" stroke="#315efb" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
        <path d="M 790 550 C 790 615, 790 648, 790 690" stroke="#7a8699" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
        <path d="M 520 550 C 520 615, 520 648, 520 690" stroke="#7a8699" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
        <path d="M 250 250 C 250 135, 520 135, 520 180" stroke="#315efb" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
        <path d="M 650 620 C 650 660, 615 690, 565 690" stroke="#1f8f4e" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>
        <path d="M 930 430 C 1025 430, 1035 560, 1100 560" stroke="#b26a00" stroke-width="4" fill="none" marker-end="url(#arrowOrange)"/>
        <path d="M 790 690 C 790 770, 930 770, 930 470" stroke="#bf3b2f" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#arrowRed)"/>
        <path d="M 930 550 C 930 615, 930 648, 930 690" stroke="#7a8699" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

        <!-- title rail -->
        <rect x="24" y="24" width="1312" height="72" rx="14" fill="#f7f8fb" stroke="#d8deea"/>
        <text x="50" y="58" font-size="24" font-weight="700" fill="#172033">Request path</text>
        <text x="50" y="82" font-size="14" fill="#5b6475">Your app sends a normal chat-completions request. SchemaFirewall only activates when a schema is selected.</text>

        <!-- app -->
        <rect x="50" y="175" width="200" height="150" rx="18" fill="#e8f1ff" stroke="#bfd3ff" stroke-width="2"/>
        <text x="80" y="214" font-size="22" font-weight="700" fill="#172033">Your app</text>
        <text x="80" y="248" font-size="15" fill="#394150">
          <tspan x="80" dy="0">OpenAI SDK, LangChain,</tspan>
          <tspan x="80" dy="24">LlamaIndex, raw fetch</tspan>
        </text>
        <text x="80" y="303" font-size="14" fill="#5b6475">Only change: base URL</text>

        <!-- schema selector -->
        <rect x="405" y="120" width="230" height="120" rx="18" fill="#e8f1ff" stroke="#bfd3ff" stroke-width="2"/>
        <text x="435" y="160" font-size="20" font-weight="700" fill="#172033">Schema selector</text>
        <text x="435" y="192" font-size="15" fill="#394150">
          <tspan x="435" dy="0">X-Schema header</tspan>
          <tspan x="435" dy="22">or [schema:Name] tag</tspan>
        </text>

        <!-- firewall container -->
        <rect x="400" y="180" width="530" height="370" rx="24" fill="#eefbf3" stroke="#b7e3c7" stroke-width="3"/>
        <text x="430" y="222" font-size="26" font-weight="700" fill="#172033">SchemaFirewall proxy</text>
        <text x="430" y="248" font-size="14" fill="#4d5a50">
          <tspan x="430" dy="0">Drop-in OpenAI-compatible HTTP proxy</tspan>
          <tspan x="430" dy="20">between your app and the model provider</tspan>
        </text>

        <!-- inner steps -->
        <rect x="430" y="285" width="210" height="104" rx="16" fill="#ffffff" stroke="#cfe6d7"/>
        <text x="458" y="320" font-size="19" font-weight="700" fill="#172033">1. Forward request</text>
        <text x="458" y="348" font-size="14" fill="#4d5a50">
          <tspan x="458" dy="0">Pass auth and payload</tspan>
          <tspan x="458" dy="20">to the upstream model</tspan>
        </text>

        <rect x="670" y="285" width="230" height="104" rx="16" fill="#ffffff" stroke="#cfe6d7"/>
        <text x="698" y="320" font-size="19" font-weight="700" fill="#172033">2. Parse response</text>
        <text x="698" y="348" font-size="14" fill="#4d5a50">
          <tspan x="698" dy="0">Strip markdown fences</tspan>
          <tspan x="698" dy="20">then parse JSON</tspan>
        </text>

        <rect x="430" y="418" width="210" height="112" rx="16" fill="#ffffff" stroke="#cfe6d7"/>
        <text x="458" y="454" font-size="19" font-weight="700" fill="#172033">3. Validate</text>
        <text x="458" y="482" font-size="14" fill="#4d5a50">
          <tspan x="458" dy="0">Check required fields,</tspan>
          <tspan x="458" dy="20">types, limits, enums,</tspan>
          <tspan x="458" dy="20">and extra fields</tspan>
        </text>

        <rect x="670" y="418" width="230" height="112" rx="16" fill="#ffffff" stroke="#cfe6d7"/>
        <text x="698" y="454" font-size="19" font-weight="700" fill="#172033">4. Repair if needed</text>
        <text x="698" y="482" font-size="14" fill="#4d5a50">
          <tspan x="698" dy="0">Safe coercions:</tspan>
          <tspan x="698" dy="20">"5" → 5, true-like strings,</tspan>
          <tspan x="698" dy="20">strip disallowed extras</tspan>
        </text>

        <!-- upstream -->
        <rect x="1090" y="175" width="220" height="150" rx="18" fill="#f4edff" stroke="#d8c6ff" stroke-width="2"/>
        <text x="1122" y="214" font-size="22" font-weight="700" fill="#172033">LLM provider</text>
        <text x="1122" y="248" font-size="15" fill="#394150">
          <tspan x="1122" dy="0">OpenAI, Copilot,</tspan>
          <tspan x="1122" dy="24">other compatible APIs</tspan>
        </text>
        <text x="1122" y="303" font-size="14" fill="#5b6475">Normal upstream target</text>

        <!-- registry -->
        <rect x="400" y="690" width="320" height="100" rx="18" fill="#fff6df" stroke="#efd69b" stroke-width="2"/>
        <text x="430" y="728" font-size="21" font-weight="700" fill="#172033">Schema registry</text>
        <text x="430" y="756" font-size="15" fill="#594d2d">
          <tspan x="430" dy="0">GET /schemas, POST /schemas/:name</tspan>
          <tspan x="430" dy="22">Load from disk or register at runtime</tspan>
        </text>

        <!-- log -->
        <rect x="760" y="690" width="340" height="100" rx="18" fill="#fff6df" stroke="#efd69b" stroke-width="2"/>
        <text x="790" y="728" font-size="21" font-weight="700" fill="#172033">Audit log</text>
        <text x="790" y="756" font-size="15" fill="#594d2d">
          <tspan x="790" dy="0">Append JSONL event with status,</tspan>
          <tspan x="790" dy="22">retries, coercions, errors, model</tspan>
        </text>

        <!-- decision panel -->
        <rect x="1090" y="500" width="220" height="240" rx="18" fill="#fff0ef" stroke="#f2c8c2" stroke-width="2"/>
        <text x="1120" y="538" font-size="21" font-weight="700" fill="#172033">Decision</text>

        <text x="1120" y="572" font-size="16" font-weight="700" fill="#1f8f4e">Valid?</text>
        <text x="1120" y="594" font-size="14" fill="#4b4545">
          <tspan x="1120" dy="0">Return cleaned JSON</tspan>
          <tspan x="1120" dy="18">to the application</tspan>
        </text>

        <text x="1120" y="634" font-size="16" font-weight="700" fill="#b26a00">Invalid?</text>
        <text x="1120" y="656" font-size="14" fill="#4b4545">
          <tspan x="1120" dy="0">Retry upstream with</tspan>
          <tspan x="1120" dy="18">schema error details</tspan>
        </text>

        <text x="1120" y="700" font-size="16" font-weight="700" fill="#bf3b2f">Still bad?</text>
        <text x="1120" y="722" font-size="14" fill="#4b4545">
          <tspan x="1120" dy="0">Strict mode returns</tspan>
          <tspan x="1120" dy="18">HTTP 422</tspan>
        </text>

        <!-- labels on arrows -->
        <text x="282" y="236" font-size="13" fill="#5b6475">chat request</text>
        <text x="968" y="236" font-size="13" fill="#5b6475">forward upstream</text>
        <text x="975" y="356" font-size="13" fill="#315efb">LLM response</text>
        <text x="268" y="150" font-size="13" fill="#315efb">select schema</text>
        <text x="516" y="670" font-size="13" fill="#5b6475">load schema</text>
        <text x="800" y="670" font-size="13" fill="#5b6475">write event</text>
        <text x="954" y="518" font-size="13" fill="#b26a00">retry with validation errors</text>
        <text x="832" y="786" font-size="13" fill="#bf3b2f">failure path after max retries</text>
        <text x="586" y="676" font-size="13" fill="#1f8f4e">success path</text>

        <!-- footer rail -->
        <rect x="24" y="824" width="1312" height="12" rx="6" fill="#eef1f7"/>
      </svg>
